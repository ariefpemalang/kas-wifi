name: Build Android APK Kas WiFi

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x gradlew

      - name: Generate Release Keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias kaswifi \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass kaswifi123 \
            -keypass kaswifi123 \
            -dname "CN=Kas WiFi, OU=RT RW Net, O=AR Cell, L=Pemalang, ST=Jawa Tengah, C=ID"

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Release APK (Signed)
        uses: actions/upload-artifact@v4
        with:
          name: KAS-WIFI-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KAS-WIFI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare APK Release Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KAS-WIFI.apk

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: KAS WIFI Mobile APK (Latest)
          body: |
            ## 📶 KAS WIFI Mobile APK (Official)

            Aplikasi Mobile Android untuk **KAS WIFI** (Aplikasi Pembukuan Kas Multi-Wallet RT/RW Net).
            Server Live: `https://kaswifi.my.id`

            ### ✅ Cara Install:
            1. Download file **`KAS-WIFI.apk`** di bawah ini.
            2. Pindahkan ke HP Android.
            3. Buka file APK → Install (Izinkan "Install dari sumber tidak dikenal" jika diminta).

            ### 📋 Info Rilis:
            - **Package ID:** `com.arcell.kaswifimobile`
            - **Target Server:** `https://kaswifi.my.id`
            - **Build:** Release APK (Signed)
          files: |
            KAS-WIFI.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
